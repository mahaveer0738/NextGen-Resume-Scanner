<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ResumeAI</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            background: var(--gradient-bg);
            display: flex;
            flex-direction: column;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo .logo-icon {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .auth-logo h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .auth-logo p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        .input-wrap input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: var(--transition-fast);
            background: var(--bg-alt);
        }

        .input-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(18, 184, 134, 0.1);
            background: #fff;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .auth-btn:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .auth-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-divider {
            text-align: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 14px;
            position: relative;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--border-color);
        }
        .auth-divider::before { left: 0; }
        .auth-divider::after  { right: 0; }

        .auth-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .success-msg {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #059669;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="../index.html" class="logo">
            <img src="../assets/img/logo.jpg" alt="ResumeAI Logo" class="logo-img">
            <span>Resume<span class="gradient-text">AI</span></span>
        </a>
        <div class="nav-buttons">
            <a href="register.html" class="primary-btn small-btn">Create Account</a>
        </div>
    </header>

    <!-- Auth Card -->
    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-logo">
                <div class="logo-icon"><i class="fa-solid fa-user-shield"></i></div>
                <h1>Welcome Back</h1>
                <p>Log in to access your resume history and AI tools.</p>
            </div>

            <div class="error-msg" id="errorMsg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Invalid credentials.</span>
            </div>

            <div class="success-msg" id="successMsg">
                <i class="fa-solid fa-circle-check"></i>
                <span id="successText">Login successful! Redirecting...</span>
            </div>

            <form id="loginForm">
                <div class="form-field">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Log In
                </button>
            </form>

            <div class="auth-divider">or</div>

            <div class="auth-link">
                Don't have an account? <a href="register.html">Create one for free</a>
            </div>

        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        // If already logged in, redirect to home
        if (isLoggedIn()) {
            window.location.href = '../index.html';
        }

        const loginForm = document.getElementById('loginForm');
        const loginBtn  = document.getElementById('loginBtn');
        const errorMsg  = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const successMsg = document.getElementById('successMsg');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Hide previous messages
            errorMsg.style.display  = 'none';
            successMsg.style.display = 'none';

            // Loading state
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';
            loginBtn.disabled = true;

            try {
                await loginUser(email, password);

                // Success
                successMsg.style.display = 'block';

                // Redirect after short delay
                setTimeout(() => {
                    // Redirect to wherever they came from, or home
                    const redirect = new URLSearchParams(window.location.search).get('redirect');
                    window.location.href = redirect || '../index.html';
                }, 1000);

            } catch (err) {
                errorText.textContent = err.message;
                errorMsg.style.display = 'block';
                loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Log In';
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
