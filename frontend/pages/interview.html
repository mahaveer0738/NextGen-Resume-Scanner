<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Prep - ResumeAI</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .page-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #20c997;
            box-shadow: 0 0 0 4px rgba(32, 201, 151, 0.1);
        }

        .results-container {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #e5e7eb;
            display: none;
        }
        
        .category-title {
            font-size: 20px;
            color: #0f172a;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f5f9;
        }

        .question-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .question-card h4 {
            color: #0f172a;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .question-card p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .q-icon {
            display: inline-block;
            width: 24px;
            color: #20c997;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo">
        <a href="../index.html" style="display:flex; align-items:center; gap:10px;">
            <div class="logo-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <span>Resume<span class="gradient-text">AI</span></span>
        </a>
    </div>
</header>

<div class="page-container">
    <div class="page-header">
        <h1>AI Interview Prep</h1>
        <p>Get personalized interview questions based on your resume experience and target role.</p>
    </div>

    <div class="form-group">
        <label>1. Upload Your Resume</label>
        <div class="upload-card" id="uploadCard" style="padding: 30px;">
            <input type="file" id="resumeInput" accept=".pdf,.doc,.docx" hidden>
            <button class="upload-btn" onclick="document.getElementById('resumeInput').click()">
                <i class="fa-solid fa-file-arrow-up"></i> Choose Resume
            </button>
            <p id="fileName" style="margin-top: 15px; color: #6b7280;">No file selected.</p>
        </div>
    </div>

    <div class="form-group">
        <label>2. Target Job Title</label>
        <input type="text" id="jobTitle" placeholder="e.g. Senior Software Engineer">
    </div>

    <button id="analyzeBtn" class="primary-btn large-btn" style="width: 100%; justify-content: center; margin-top: 20px;">
        Generate Questions
    </button>

    <!-- Results Section -->
    <div class="results-container" id="resultsContainer">
        
        <h3 class="category-title"><i class="fa-solid fa-laptop-code" style="color:#3b82f6;"></i> Technical Questions</h3>
        <div id="technicalQ"></div>

        <h3 class="category-title" style="margin-top: 40px;"><i class="fa-solid fa-users" style="color:#8b5cf6;"></i> Behavioral Questions</h3>
        <div id="behavioralQ"></div>

        <h3 class="category-title" style="margin-top: 40px;"><i class="fa-solid fa-compass" style="color:#f59e0b;"></i> Situational Questions</h3>
        <div id="situationalQ"></div>

    </div>
</div>

<script src="../assets/js/api.js"></script>
<script>
    let selectedFile = null;

    document.getElementById('resumeInput').addEventListener('change', function() {
        if (this.files.length > 0) {
            selectedFile = this.files[0];
            document.getElementById('fileName').innerHTML = `✓ ${selectedFile.name} selected`;
            document.getElementById('fileName').style.color = '#10b981';
        }
    });

    document.getElementById('analyzeBtn').addEventListener('click', async function() {
        const title = document.getElementById('jobTitle').value.trim();
        
        if (!selectedFile) {
            alert("Please upload a resume first.");
            return;
        }
        if (!title) {
            alert("Please enter a target job title.");
            return;
        }

        const btn = document.getElementById('analyzeBtn');
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating...`;
        btn.disabled = true;

        try {
            const response = await generateInterviewQuestions(selectedFile, title);
            const data = response.data || response;

            document.getElementById('resultsContainer').style.display = 'block';
            
            const renderQuestions = (containerId, questions) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                if (!questions || questions.length === 0) {
                    container.innerHTML = '<p>No questions generated.</p>';
                    return;
                }
                questions.forEach((q, index) => {
                    container.innerHTML += `
                        <div class="question-card">
                            <h4><span class="q-icon">Q${index+1}</span> ${q.question}</h4>
                            <p><strong>Context from Resume:</strong> ${q.context_from_resume}</p>
                            <p style="margin-top: 8px;"><strong>How to answer:</strong> ${q.suggested_answer_strategy}</p>
                        </div>
                    `;
                });
            };

            renderQuestions('technicalQ', data.technical_questions);
            renderQuestions('behavioralQ', data.behavioral_questions);
            renderQuestions('situationalQ', data.situational_questions);

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.innerHTML = `Generate Questions`;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
