<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Matcher - ResumeAI</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .page-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #374151;
        }

        .form-group textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: 0.2s;
        }

        .form-group textarea:focus {
            border-color: #20c997;
            box-shadow: 0 0 0 4px rgba(32, 201, 151, 0.1);
        }

        .results-container {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #e5e7eb;
            display: none;
        }
        
        .score-banner {
            background: linear-gradient(135deg, rgba(32, 201, 151, 0.1), rgba(16, 185, 129, 0.1));
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid rgba(32, 201, 151, 0.2);
        }

        .score-banner h2 {
            font-size: 48px;
            color: #10b981;
            margin-bottom: 10px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .tag.found {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .tag.missing {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo">
        <a href="../index.html" style="display:flex; align-items:center; gap:10px;">
            <div class="logo-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <span>Resume<span class="gradient-text">AI</span></span>
        </a>
    </div>
</header>

<div class="page-container">
    <div class="page-header">
        <h1>AI Job Matcher</h1>
        <p>Compare your resume against a specific job description to see if you are a good fit.</p>
    </div>

    <div class="form-group">
        <label>1. Upload Your Resume</label>
        <div class="upload-card" id="uploadCard" style="padding: 30px;">
            <input type="file" id="resumeInput" accept=".pdf,.doc,.docx" hidden>
            <button class="upload-btn" onclick="document.getElementById('resumeInput').click()">
                <i class="fa-solid fa-file-arrow-up"></i> Choose Resume
            </button>
            <p id="fileName" style="margin-top: 15px; color: #6b7280;">No file selected.</p>
        </div>
    </div>

    <div class="form-group">
        <label>2. Paste Job Description</label>
        <textarea id="jobDescription" placeholder="Paste the full job description here..."></textarea>
    </div>

    <button id="analyzeBtn" class="primary-btn large-btn" style="width: 100%; justify-content: center; margin-top: 20px;">
        Analyze Match
    </button>

    <!-- Results Section -->
    <div class="results-container" id="resultsContainer">
        <div class="score-banner">
            <h2 id="matchScore">0%</h2>
            <h3>Match Score</h3>
            <p id="matchSummary" style="color: #6b7280; margin-top: 10px;"></p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div>
                <h4 style="margin-bottom: 15px;"><i class="fa-solid fa-check" style="color: #10b981;"></i> Skills Matched</h4>
                <div class="tags-container" id="foundSkills"></div>
            </div>
            <div>
                <h4 style="margin-bottom: 15px;"><i class="fa-solid fa-xmark" style="color: #ef4444;"></i> Missing Skills</h4>
                <div class="tags-container" id="missingSkills"></div>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/api.js"></script>
<script>
    let selectedFile = null;

    document.getElementById('resumeInput').addEventListener('change', function() {
        if (this.files.length > 0) {
            selectedFile = this.files[0];
            document.getElementById('fileName').innerHTML = `✓ ${selectedFile.name} selected`;
            document.getElementById('fileName').style.color = '#10b981';
        }
    });

    document.getElementById('analyzeBtn').addEventListener('click', async function() {
        const jd = document.getElementById('jobDescription').value.trim();
        
        if (!selectedFile) {
            alert("Please upload a resume first.");
            return;
        }
        if (!jd) {
            alert("Please paste a job description.");
            return;
        }

        const btn = document.getElementById('analyzeBtn');
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Analyzing Match...`;
        btn.disabled = true;

        try {
            const response = await matchJob(selectedFile, jd);
            const data = response.data;

            // Show results
            document.getElementById('resultsContainer').style.display = 'block';
            document.getElementById('matchScore').textContent = data.match_percentage + '%';
            document.getElementById('matchSummary').textContent = data.summary;

            // Populate Found Skills
            const foundContainer = document.getElementById('foundSkills');
            foundContainer.innerHTML = '';
            data.found_skills.forEach(skill => {
                foundContainer.innerHTML += `<span class="tag found">${skill}</span>`;
            });

            // Populate Missing Skills
            const missingContainer = document.getElementById('missingSkills');
            missingContainer.innerHTML = '';
            data.missing_skills.forEach(skill => {
                missingContainer.innerHTML += `<span class="tag missing">${skill}</span>`;
            });

        } catch (error) {
            alert("Error analyzing match: " + error.message);
        } finally {
            btn.innerHTML = `Analyze Match`;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
